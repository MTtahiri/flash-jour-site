<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>انضم إلى Flash-Jour — شبكة B2B الفواكه والخضروات</title>
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://www.flash-jour.com/ar/rejoindre/" />
  <link rel="alternate" hreflang="fr" href="https://www.flash-jour.com/rejoindre/" />
  <link rel="alternate" hreflang="en" href="https://www.flash-jour.com/en/join/" />
  <link rel="alternate" hreflang="ar" href="https://www.flash-jour.com/ar/rejoindre/" />
  <link rel="alternate" hreflang="x-default" href="https://www.flash-jour.com/rejoindre/" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <header>
    <nav>
      <a href="/ar/" class="logo">Flash-Jour</a>
      <ul>
        <li><a href="/ar/acheteurs/">المشترون</a></li>
        <li><a href="/ar/producteurs/">المنتجون</a></li>
        <li><a href="/ar/faq/">الأسئلة الشائعة</a></li>
        <li><a href="/ar/rejoindre/" class="cta" aria-current="page">انضم</a></li>
      </ul>
      <div class="lang-switch"><a href="/rejoindre/">FR</a> | <a href="/en/join/">EN</a></div>
    </nav>
  </header>
  <div class="page-hero">
    <div class="container">
      <h1>قدّم طلب انضمامك</h1>
      <p>الوصول بناءً على الملف. مراجعة خلال 48 ساعة. شبكة مهنية خاصة.</p>
    </div>
  </div>
  <main>
    <section style="max-width:640px; margin:0 auto;">
      <form id="candidature-form">
        <input type="text" name="website" id="website" autocomplete="off" tabindex="-1" style="position:absolute;left:-9999px;" aria-hidden="true" />
        <div class="form-group"><label>الاسم الكامل *</label><input type="text" name="nom" required placeholder="الاسم الأول واسم العائلة" /></div>
        <div class="form-group"><label>الشركة *</label><input type="text" name="entreprise" required /></div>
        <div class="form-group"><label>البريد الإلكتروني المهني *</label><input type="email" name="email" required /></div>
        <div class="form-group"><label>واتساب (مع رمز الدولة)</label><input type="tel" name="whatsapp" placeholder="+212 6 00 00 00 00" /></div>
        <div class="form-group"><label>البلد *</label><select name="pays" required><option value="">— اختر —</option><option>المغرب</option><option>السنغال</option><option>مصر</option><option>تونس</option><option>تركيا</option><option>الجزائر</option><option>الأردن</option><option>المملكة العربية السعودية</option><option>الإمارات العربية المتحدة</option><option>أخرى</option></select></div>
        <div class="form-group"><label>المنتجات المعنية *</label><input type="text" name="produits" required placeholder="مثال: مانجو، حمضيات، طماطم..." /></div>
        <div class="form-group"><label>صف نشاطك التجاري *</label><textarea name="message" required placeholder="نشاطك، الأحجام التقريبية، ما تبحث عنه..."></textarea></div>
        <button type="submit" class="btn-submit">إرسال طلبي ←</button>
        <p id="form-status" class="form-note" role="status"></p>
        <p class="form-note">بياناتك سرية. لا مشاركة بدون موافقتك. رد خلال 48 ساعة.</p>
      </form>
      <script>
        const form = document.getElementById('candidature-form');
        const statusEl = document.getElementById('form-status');
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const submitBtn = form.querySelector('.btn-submit');
          submitBtn.disabled = true;
          statusEl.textContent = 'جارٍ الإرسال…';
          statusEl.style.color = '';
          try {
            const res = await fetch('/api/join', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                nom: form.nom.value,
                entreprise: form.entreprise.value,
                email: form.email.value,
                whatsapp: form.whatsapp.value,
                pays: form.pays.value,
                produits: form.produits.value,
                message: form.message.value,
                langue: 'ar',
                source: 'flash-jour.com/ar/rejoindre',
                website: form.website.value,
              }),
            });
            if (!res.ok) throw new Error('request_failed');
            form.reset();
            Array.from(form.elements).forEach(el => el.disabled = true);
            statusEl.style.color = '#2ecc71';
            statusEl.textContent = 'شكراً! تم استلام طلبك. الرد خلال 48 ساعة.';
          } catch (err) {
            submitBtn.disabled = false;
            statusEl.style.color = '#e63946';
            statusEl.textContent = 'فشل الإرسال. حاول مجدداً أو راسلنا على contact@flash-jour.com.';
          }
        });
      </script>
    </section>
  </main>
  <footer>
    <p>© 2025 Flash-Jour — <a href="mailto:contact@flash-jour.com">contact@flash-jour.com</a></p>
  </footer>
</body>
</html>
