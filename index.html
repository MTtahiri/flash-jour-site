<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash-Jour | 1 Produit, 1 Jour, Prix Imbattable</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Barre de Navigation -->
    <header>
        <nav>
            <div class="logo">⚡ Flash-Jour</div>
            <div class="tagline">La vente flash du jour</div>
        </nav>
    </header>

    <!-- Section Principale (Le Produit) -->
    <main>
        <div class="product-container">
            <span class="badge-live">🔴 EN DIRECT EN CE MOMENT</span>
            <h1>Le Produit Vedette du Jour</h1>
            <p class="sub-title">Une offre unique. Un prix imbattable. Disponible pendant 24 heures seulement.</p>
            
            <!-- Zone Prix & Bouton -->
            <div class="price-box">
                <span class="old-price">99,00 €</span>
                <span class="new-price">39,90 €</span>
            </div>

            <!-- Bouton d'action -->
            <a href="https://app.shiptothemoon.com" class="cta-button">Profiter de l'offre flash</a>
        </div>
    </main>

    <!-- Pied de page -->
    <footer>
        <p>&copy; 2026 Flash-Jour. Tous droits réservés.</p>
    </footer>

</body>
</html>
